<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TikTok Live Bar">
  <defs>
    <linearGradient id="g" x1="14" y1="10" x2="50" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0d56a"/>
      <stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#121218"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#g)" stroke-width="3"/>
  <!-- Note head centered slightly left of mid, stem on axis x=34 -->
  <ellipse cx="27" cy="40" rx="7" ry="5.2" fill="url(#g)" transform="rotate(-18 27 40)"/>
  <rect x="32.6" y="16" width="3.2" height="25" rx="1.2" fill="url(#g)"/>
  <path d="M35.8 16c4.2 1.8 7.4 4.6 8.6 8.2-2.8-1.4-5.6-2.2-8.6-2.6V16z" fill="url(#g)"/>
  <!-- Live dot sits on the frame corner, not the ring, so ring stays centered -->
  <circle cx="50" cy="14" r="3.2" fill="#ff4d4f"/>
</svg>
